<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Inventory Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <h1 class="text-center mb-4">Inventory Manager</h1>

    <form id="productForm" class="row g-3 mb-4">
      <input type="hidden" id="productId">
      <div class="col-md-5">
        <input type="text" class="form-control" id="name" placeholder="Product name" required>
      </div>
      <div class="col-md-4">
        <input type="number" class="form-control" id="quantity" placeholder="Quantity" required>
      </div>
      <div class="col-md-3 d-flex gap-2">
        <button type="submit" class="btn btn-primary">Save</button>
        <button type="button" class="btn btn-secondary" id="cancelUpdate">Cancel</button>
      </div>
    </form>

    <ul class="list-group" id="productList"></ul>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
